<head> 
      <title>App6---HTML5-Canvas</title>

<script>
var docMod = document.lastModified; // loads last modified time stamp into docMod variable

      <style>	
      .body {
           margin: 0em;
      }
      /* Canvas styling: centered with a visible border */
      #myCanvas {
          border: 1px solid #000000;
          background-color: #ffffff;
          display: block;
          margin: 10px auto; /* Centers the canvas */
          max-width: 100%;   /* Keeps it from overflowing on small screens */
      }
      </style>

      <script>
      // This function draws a rectangle.
      function draw_rect() {
          var canvas = document.getElementById("myCanvas");
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#FFF0F5"; // makes a light pink rectangle
          ctx.fillRect(20, 20, 100, 100);
      }

      // This function draws my name onto the canvas.
      function draw_name() {
          var canvas = document.getElementById("myCanvas");
          var ctx = canvas.getContext("2d");
          ctx.font = "25px Arial";
          ctx.fillStyle = "black";
          ctx.fillText("Kayla Diep", 20, 160);
      }

      // This function loads an image onto canvas.
      function draw_image() {
          var canvas = document.getElementById("myCanvas");
          var ctx = canvas.getContext("2d");
          var img = new Image();
          img.onload = function() {
              ctx.drawImage(img, 150, 20, 120, 120);
          };
          // Pusheen the Cat image pops up
	img.src = "https://pngimg.com/uploads/pusheen/pusheen_PNG44.png";
      }

      // This button resets the canvas.
      function clear_canvas() {
          var canvas = document.getElementById("myCanvas");
          var ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      </script>
   </head> 

<body>
<div id="header" class="w3-container w3-flat-carrot">
	<h1>App6---HTML5-Canvas</h1>
</div>
	
<div id="content" class="w3-container">
	<p>Hello! This app demonstrates basic HTML5 Canvas functions.</p>

    <canvas id="myCanvas" width="300" height="250"></canvas>

    <div class="w3-padding-16">
        <button onclick="draw_rect();" class="w3-button w3-border w3-round">Rectangle</button>
        <button onclick="draw_name();" class="w3-button w3-border w3-round">Name</button>
        <button onclick="draw_image();" class="w3-button w3-border w3-round">Image</button>
        <button onclick="clear_canvas();" class="w3-button w3-border w3-round">Clear</button>
    </div>

    <p>This code is for demonstration and entertainment purposes only. It is not for medical diagnosis.</p>
</div>
